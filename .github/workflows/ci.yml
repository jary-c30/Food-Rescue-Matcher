name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Dummy values so app.core.config can load; real secrets never belong in CI config.
    env:
      DATABASE_URL: postgresql+psycopg2://user:password@localhost:5432/test
      SECRET_KEY: ci-test-key
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
